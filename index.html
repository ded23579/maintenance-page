    <style>
        /* --- CSS Variables (Kustomisasi Mudah) --- */
        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --card-bg-opacity: 0.15;
            --card-border-opacity: 0.2;
            --text-color: #ffffff;
            --heading-font-size: 2em;
            --body-font-size: 1.1em;
            --animation-duration-slow: 20s;
            --animation-duration-fast: 2s;
        }

        /* --- Reset & Global Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            overflow: hidden;
            position: relative;
            color: var(--text-color);
        }

        /* --- Animasi Latar Belakang --- */
        .bg-bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float var(--animation-duration-slow) infinite ease-in-out;
        }

        .bg-bubble:nth-child(1) { width: 80px; height: 80px; top: 20%; left: 10%; animation-duration: 25s; }
        .bg-bubble:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-duration: 30s; animation-delay: 2s; }
        .bg-bubble:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 30%; animation-duration: 22s; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            50% { transform: translateY(-100px) rotate(180deg); opacity: 0.8; }
        }

        /* --- Container Utama dengan Efek 3D --- */
        .maintenance-container {
            perspective: 1000px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .maintenance-card {
            background: rgba(255, 255, 255, var(--card-bg-opacity));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, var(--card-border-opacity));
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37), inset 0 0 20px rgba(255, 255, 255, 0.1);
            transform: rotateX(5deg) rotateY(-5deg);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .maintenance-card:hover {
            transform: rotateX(0deg) rotateY(0deg) scale(1.02);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5), inset 0 0 25px rgba(255, 255, 255, 0.15);
        }

        /* --- Ikon Gear yang Berputar --- */
        .icon-wrapper {
            margin-bottom: 25px;
            display: inline-block;
        }

        .icon-wrapper svg {
            width: 80px;
            height: 80px;
            fill: var(--text-color);
            animation: spin-pulse var(--animation-duration-fast) infinite linear;
        }

        @keyframes spin-pulse {
            0% { transform: rotate(0deg) scale(1); opacity: 0.8; }
            50% { transform: rotate(180deg) scale(1.1); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.8; }
        }

        /* --- Typography --- */
        h1 {
            font-size: var(--heading-font-size);
            font-weight: 600;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: var(--body-font-size);
            font-weight: 400;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* --- Progress Bar Animasi --- */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffffff, #f0f0f0);
            border-radius: 3px;
            animation: progress-load 4s infinite ease-out;
        }

        @keyframes progress-load {
            0% { width: 0%; }
            80% { width: 90%; } /* Tidak pernah 100% untuk efek loop yang mulus */
            100% { width: 100%; }
        }
        
        .progress-text {
            font-size: 0.9em;
            opacity: 0.7;
        }

        /* --- Footer Dinamis --- */
        .card-footer {
            margin-top: 30px;
            font-size: 0.85em;
            opacity: 0.6;
        }

        /* --- Responsive Design --- */
        @media (max-width: 600px) {
            .maintenance-card {
                padding: 30px 25px;
                transform: rotateX(0deg) rotateY(0deg);
            }
            .maintenance-card:hover {
                transform: scale(1.01);
            }
            h1 { font-size: 1.8em; }
            p { font-size: 1em; }
        }
    </style>
</head>
<body>

    <div class="bg-bubble"></div>
